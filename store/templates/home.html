<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Mart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <!-- Navigation bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">⚡ Flash-Mart</a>

            <a href="{% url 'select_role' %}" class="btn btn-warning btn-sm">Join Now</a>
        </div>
    </nav>

    <!-- Hero section -->
    <div class="container py-5 text-center">
        <h1 class="display-5 fw-bold">Prices Drop Every Hour! 📉</h1>
        <p class="text-muted">High-value essentials, cheaper as time passes. Catch 'em fast!</p>
    </div>
    <!-- loop for fetching products from admin panel -->
    <div class="container">
        <div class="row">
            {% for p in products %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">

                        <span class="badge bg-primary mb-2">{{ p.category.name }}</span>
                        <h5 class="card-title">{{ p.name }}</h5>
                        <h3 class="text-danger mb-0">₹{{ p.current_price }}</h3>
                        <p class="text-muted text-decoration-line-through">MRP: ₹{{ p.original_price }}</p>
                        <a href="{% url 'select_role' %}" class="btn btn-warning w-100 mt-2 fw-bold">Grab Now</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>





</body>

</html>
