<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} — Flash-Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-hero {
            padding: 40px 0;
        }
    </style>
</head>

<body>
    <div class="container product-hero">
        <a href="{% url 'home' %}" class="btn btn-link mb-3">← Back to deals</a>
        <div class="card p-4">
            <div class="row g-4">
                <div class="col-md-4 text-center">
                    {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded"> {% else %}
                    <div class="display-1">📦</div>
                    {% endif %}
                </div>
                <div class="col-md-8">
                    <h2 class="fw-bold">{{ product.name }}</h2>
                    <p class="text-muted">Sold by: {% if product.shopkeeper %}{{ product.shopkeeper.shop_name }}{% else %}Unknown{% endif %}</p>
                    <h3 class="text-danger">₹{{ product.current_price }}</h3>
                    <p class="text-muted text-decoration-line-through">₹{{ product.original_price }}</p>
                    <p class="small text-muted">{{ product.time_left }}</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
