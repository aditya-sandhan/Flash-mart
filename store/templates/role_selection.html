<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Choose Your Role | Flash-Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light vh-100 d-flex align-items-center">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Welcome to Flash-Mart</h2>
            <p class="text-muted">Choose how you want to interact with the marketplace</p>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card h-100 shadow border-0 text-center p-4">
                    <div class="display-1">🛒</div>
                    <h3 class="mt-3">I am a Customer</h3>
                    <p class="text-muted">I want to buy high-value products at falling prices.</p>
                    <button class="btn btn-primary btn-lg mt-auto">Start Shopping</button>
                </div>
            </div>
            <div class="col-md-5 mb-4">
                <div class="card h-100 shadow border-0 text-center p-4">
                    <div class="display-1">🏪</div>
                    <h3 class="mt-3">I am a Shopkeeper</h3>
                    <p class="text-muted">I want to list my expiring products and recover costs.</p>
                    <button class="btn btn-success btn-lg mt-auto">Open My Shop</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
