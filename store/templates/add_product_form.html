{% extends 'base.html' %} {% block title %}Add Inventory | Flash-Mart{% endblock %} {% block extra_head %}
<style>
    body {
        font-family: 'Inter', sans-serif;
        background: #f0f2f5;
    }
    
    .form-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        background: white;
    }
    
    .form-control {
        border-radius: 10px;
        padding: 12px;
        border: 1px solid #e0e0e0;
        background: #fafafa;
    }
    
    .form-control:focus {
        box-shadow: none;
        border-color: #ffc107;
        background: white;
    }
    
    .btn-submit {
        background: #000;
        color: #fff;
        font-weight: 700;
        border-radius: 10px;
        padding: 14px;
        transition: 0.3s;
    }
    
    .btn-submit:hover {
        background: #333;
        transform: translateY(-2px);
    }
</style>
{% endblock %} {% block content %}
<div class="vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Inventory Management 📦</h2>
                    <p class="text-muted small">List your products for high-speed hourly decay.</p>
                </div>

                <div class="card form-card p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Product Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Nescafe Gold 100g" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Product Category</label>
                            <select name="category" class="form-control" required>
                                    <option value="" selected disabled>-- Select a Category --</option>

                                        {% for cat in categories %}
                                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                                        {% empty %}
                                            <option value="" disabled>No categories found in database!</option>
                                        {% endfor %}
                                </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">MRP (Original)</label>
                                <input type="number" name="mrp" class="form-control" placeholder="₹550" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Start Price</label>
                                <input type="number" name="start_price" class="form-control" placeholder="₹500" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Expiry Date & Time</label>
                            <input type="datetime-local" name="expiry" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-submit w-100 shadow-sm">🚀 List Product Live</button>

                        <div class="text-center mt-3">
                            <a href="{% url 'shop_dashboard' %}" class="text-secondary small text-decoration-none">← Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
