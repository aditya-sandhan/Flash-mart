{% extends 'base.html' %} {% block content %}
<div class="container py-5">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="fw-bold">Welcome, {{ customer.full_name }}! 👋</h1>
            <p class="text-muted">Tracking your high-value price drops here.</p>
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 text-center rounded-4">
                <h3 class="fw-bold text-primary">0</h3>
                <p class="mb-0 text-muted small fw-bold">Items in Watchlist</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 text-center rounded-4">
                <h3 class="fw-bold text-success">₹0.00</h3>
                <p class="mb-0 text-muted small fw-bold">Total Savings</p>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="{% url 'home' %}" class="btn btn-warning px-5 py-3 fw-bold rounded-pill">Start Shopping Now</a>
    </div>
</div>
{% endblock %}
